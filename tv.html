<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TV — Painel de Vendas Grupo Visual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Satoshi','Inter','Segoe UI',system-ui,Arial,sans-serif;}
  :root{--bg:#0f111a;--bg2:#1e233a;--card:#161a2b;--border:rgba(255,255,255,.07);--text:#f1f5f9;--muted:#8b95a7;--gold:#d4af37;--green:#00d084;--red:#ff4757;}
  html,body{height:100%;background:radial-gradient(1300px 800px at 80% -15%, #1a2036, var(--bg));color:var(--text);overflow:hidden;}
  .mono,.t-rank,.t-qtd,.t-rec,.linha .qtd,.gcol .gbar .gv,.valor-r,.forma-r,.ultra-banner .nm{font-family:'JetBrains Mono',ui-monospace,'Courier New',monospace;font-variant-numeric:tabular-nums;letter-spacing:-.5px;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#2d3748;border-radius:4px;}
  button{font-family:inherit;cursor:pointer;}
  .hidden{display:none!important;}

  /* ---------- ESTRUTURA ---------- */
  #painel{height:100vh;display:flex;flex-direction:column;}
  /* NAV */
  .nav{display:flex;align-items:center;justify-content:space-between;gap:1.2vw;height:9.5vh;min-height:64px;padding:0 1.8vw;background:rgba(22,26,43,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
  .brand{display:flex;align-items:center;gap:1vw;}
  .brand .logo{width:5.6vh;height:5.6vh;font-size:3vh;display:flex;align-items:center;justify-content:center;}
  .brand .logo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 8px rgba(0,0,0,.45));}
  .brand h1{font-size:2.9vh;font-weight:900;letter-spacing:1px;line-height:1;}
  .brand h1 span{color:var(--gold);}
  .brand .sub{display:inline-flex;align-items:center;gap:.9vw;font-size:1.15vh;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-top:.6vh;}

  /* PÓDIO TOP 3 */
  .podio{display:grid;grid-template-columns:1fr 1.25fr 1fr;align-items:end;gap:1.4vw;padding:1.1vh 6vw 0;}
  .pod{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;position:relative;}
  .pod-rank{position:absolute;top:3.5vh;left:.4vw;font-size:5.5vh;font-weight:900;line-height:1;color:var(--pc,#888);text-shadow:0 .4vh 1.2vh rgba(0,0,0,.7),0 0 2vh var(--pc,#000);z-index:5;pointer-events:none;}
  .pod-1 .pod-rank{font-size:7.5vh;top:4vh;}
  .pod-med{font-size:3vh;line-height:1;margin-bottom:.3vh;display:flex;align-items:center;justify-content:center;}
  .medal-pod{width:6vh;height:6vh;object-fit:contain;font-size:2.4vh;filter:drop-shadow(0 3px 8px rgba(0,0,0,.4));}
  .pod-1 .medal-pod{width:7.5vh;height:7.5vh;}
  .pod-av{width:13vh;height:13vh;display:flex;align-items:center;justify-content:center;font-size:7vh;background:transparent;transform:scale(2);transform-origin:center bottom;}
  .pod-av img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 3px var(--pc,#888)) drop-shadow(0 0 10px var(--pc,#888));}
  .pod-nm{font-weight:800;font-size:2.3vh;margin-top:.8vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .pod-eq{font-size:1.55vh;font-weight:700;}
  .pedestal{margin-top:1vh;width:100%;background:linear-gradient(180deg,#1f2540,var(--card));border:1px solid var(--border);border-top:.4vh solid var(--pc,#888);border-radius:1.2vh 1.2vh 0 0;padding:1vh .6vw .8vh;display:flex;flex-direction:column;align-items:center;gap:.2vh;}
  .pod-pos{font-size:1.6vh;font-weight:900;color:var(--pc,#888);letter-spacing:1px;}
  .pod-pts{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;font-size:3.4vh;font-weight:900;line-height:1;}
  .pod-pts span{display:block;font-family:'Satoshi','Inter',sans-serif;font-size:1.25vh;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-top:.2vh;}
  .pod-prize{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;font-size:2.15vh;font-weight:800;color:var(--green);margin-top:.5vh;}
  .pod-1 .pod-av{width:17vh;height:17vh;}
  .pod-1 .pod-nm{font-size:2.9vh;}
  .pod-1 .pod-med{font-size:4vh;}
  .pod-1 .pod-pts{font-size:4.5vh;}
  .pod-1 .pedestal{min-height:16vh;background:linear-gradient(180deg,rgba(212,175,55,.18),var(--card));}
  .pod-2 .pedestal{min-height:11vh;background:linear-gradient(180deg,rgba(203,213,225,.16),var(--card));}
  .pod-3 .pedestal{min-height:9vh;background:linear-gradient(180deg,rgba(205,127,50,.16),var(--card));}
  .pod-vazio{opacity:.3;}
  .pod-vazio .pedestal{min-height:9vh;}

  /* CORPO */
  .corpo{flex:1;display:grid;grid-template-columns:1.25fr .75fr;gap:1.2vw;padding:.5vh 1.8vw .8vh;min-height:0;}
  .card{background:linear-gradient(180deg,#1a1f33,var(--card));border:1px solid var(--border);border-radius:1.4vh;padding:1.4vh 1.3vw;display:flex;flex-direction:column;min-height:0;box-shadow:0 8px 30px rgba(0,0,0,.32);}
  .cardhead,.slidehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:1vh;}
  .cardhead h2,.slidehead h2{font-size:2.2vh;font-weight:800;letter-spacing:.3px;color:var(--text);}
  .tag{font-size:1.1vh;font-weight:800;color:var(--green);background:rgba(0,208,132,.12);border-radius:.5vh;padding:.35vh .8vw;letter-spacing:1.5px;display:flex;align-items:center;gap:.4vw;}
  .tag .pulse{width:.9vh;height:.9vh;}

  /* TABELA RANKING */
  .thead{display:grid;grid-template-columns:4vh 5vh 1.8fr 7vh 13vh 1fr;gap:1vw;align-items:center;padding:.7vh 1vw;font-size:1.3vh;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);background:rgba(255,255,255,.04);border-radius:.8vh;}
  .thead .r{text-align:right;}
  .thead .c{text-align:center;}
  .t-medal{display:flex;align-items:center;justify-content:center;}
  .ranking{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:.4vh;margin-top:.6vh;}
  .trow{display:grid;grid-template-columns:4vh 5vh 1.8fr 7vh 13vh 1fr;gap:1vw;align-items:center;padding:.55vh 1vw;border-radius:1vh;border:1px solid transparent;transition:background .2s,transform .2s;}
  .trow:nth-child(even){background:rgba(255,255,255,.018);}
  .ranking .trow.pod1{background:linear-gradient(90deg,rgba(212,175,55,.12),transparent);border-color:rgba(212,175,55,.32);}
  .t-rank{font-size:2.4vh;font-weight:900;color:var(--muted);text-align:center;}
  .ranking .trow.pod1 .t-rank{color:var(--gold);}
  /* faixa + numero na cor da posicao tambem no 2o (prata) e 3o (bronze) */
  .ranking .trow.pod2{background:linear-gradient(90deg,rgba(203,213,225,.13),transparent);border-color:rgba(203,213,225,.32);}
  .ranking .trow.pod3{background:linear-gradient(90deg,rgba(205,127,50,.13),transparent);border-color:rgba(205,127,50,.32);}
  .ranking .trow.pod2 .t-rank{color:#cbd5e1;}
  .ranking .trow.pod3 .t-rank{color:#cd7f32;}
  .t-vend{display:flex;align-items:center;gap:.8vw;min-width:0;}
  .t-ic{width:5.4vh;height:5.4vh;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:2vh;color:#fff;overflow:hidden;background:transparent;}
  .t-ic img{width:100%;height:100%;object-fit:cover;}
  /* destaque (glow na cor da posicao) no 1o, 2o e 3o da tabela */
  .ranking .trow.pod1 .t-ic{filter:drop-shadow(0 0 2px #d4af37) drop-shadow(0 0 7px rgba(212,175,55,.85));}
  .ranking .trow.pod2 .t-ic{filter:drop-shadow(0 0 2px #cbd5e1) drop-shadow(0 0 7px rgba(203,213,225,.85));}
  .ranking .trow.pod3 .t-ic{filter:drop-shadow(0 0 2px #cd7f32) drop-shadow(0 0 7px rgba(205,127,50,.85));}
  .t-nm{flex:1;font-size:2.3vh;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .medal-r{width:5vh;height:5vh;object-fit:contain;flex-shrink:0;font-size:2vh;}
  .medal-fb{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:900;border-radius:50%;line-height:1;}
  .medal-none{filter:grayscale(1) brightness(.7) opacity(.45);}
  .medal-traco{display:inline-flex;align-items:center;justify-content:center;color:var(--muted);font-weight:900;font-size:2.6vh;line-height:1;}
  .ladder{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vh .6vw;align-content:center;padding:1vh 0;}
  .lad{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5vh;}
  .medal-l{width:8.5vh;height:8.5vh;object-fit:contain;font-size:3.6vh;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));}
  .lad-nm{font-size:1.6vh;font-weight:800;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;}
  .lad-ct{font-size:2.5vh;font-weight:900;font-family:'JetBrains Mono',monospace;color:var(--text);}
  .t-nm small{display:block;font-size:1.4vh;font-weight:700;}
  .t-qtd{font-size:2.9vh;font-weight:900;text-align:right;}
  .t-rec{font-size:1.85vh;color:var(--muted);text-align:right;}
  .t-rec.recebeu{color:var(--green);font-weight:700;}
  .t-bar{height:1.5vh;background:#0006;border-radius:999px;overflow:hidden;}
  .t-bar i{display:block;height:100%;border-radius:999px;transition:width .8s;}

  /* PAINEL ROTATIVO */
  .slidedots{display:flex;gap:.7vh;}
  .slidedots i{width:1.1vh;height:1.1vh;border-radius:50%;background:var(--border);transition:background .3s;}
  .slidedots i.on{background:var(--gold);}
  .slidebox{flex:1;display:flex;flex-direction:column;min-height:0;}
  .slidebox>.grafico,.slidebox>.ranking{flex:1;}
  .slidebox.fadein{animation:slideFade .5s ease;}
  @keyframes slideFade{from{opacity:0;transform:translateY(1.4vh);}to{opacity:1;transform:translateY(0);}}
  /* linhas usadas DENTRO dos slides */
  .ranking .linha{display:flex;align-items:center;gap:1vw;background:var(--bg2);border:1px solid var(--border);border-radius:1.1vh;padding:.7vh 1vw;}
  .linha .pos{font-size:2.7vh;font-weight:900;width:4.5vh;text-align:center;}
  .linha .foto{width:6.1vh;height:6.1vh;border-radius:50%;object-fit:cover;border:.3vh solid var(--border);flex-shrink:0;background:transparent;display:flex;align-items:center;justify-content:center;font-size:2.7vh;}
  .linha .info{flex:1;min-width:0;}
  .linha .info .nm{font-size:2.3vh;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .linha .info .eqtag{font-size:1.6vh;font-weight:700;}
  .linha .barra{flex:1.4;height:1.5vh;background:#0006;border-radius:999px;overflow:hidden;}
  .linha .barra i{display:block;height:100%;border-radius:999px;transition:width .8s;}
  .linha .qtd{font-size:3.1vh;font-weight:900;width:5.4vh;text-align:right;}
  .grafico{flex:1;display:flex;align-items:flex-end;justify-content:space-around;gap:.6vw;padding-top:2vh;min-height:0;}
  .gcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;flex:1;gap:.5vh;}
  .gcol .gbar{width:62%;max-width:5vw;border-radius:.8vh .8vh 0 0;transition:height .8s;min-height:.4vh;display:flex;align-items:flex-start;justify-content:center;}
  .gcol .gbar .gv{margin-top:-2.8vh;font-size:2.1vh;font-weight:900;}
  .gcol .gfoto{width:5.5vh;height:5.5vh;border-radius:50%;object-fit:cover;border:.3vh solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center;}
  .gcol .gnm{font-size:1.5vh;color:var(--muted);max-width:7vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;}
  .vazio{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:2.3vh;text-align:center;}

  .pulse{width:1.1vh;height:1.1vh;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 0 0 rgba(0,208,132,.6);animation:pulseRing 1.5s ease-in-out infinite;}
  @keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(0,208,132,.7);transform:scale(1);}70%{box-shadow:0 0 0 1.5vh rgba(0,208,132,0);transform:scale(1.25);}100%{box-shadow:0 0 0 0 rgba(0,208,132,0);transform:scale(1);}}

  #iniciar{position:fixed;inset:0;background:radial-gradient(900px 600px at 50% 30%, #1a2036, var(--bg));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;z-index:200;text-align:center;padding:5vw;}
  #iniciar .logo{font-size:11vh;width:18vh;height:18vh;display:flex;align-items:center;justify-content:center;}
  #iniciar .logo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 40px rgba(192,132,252,.55));}
  #iniciar h1{font-size:4vh;font-weight:900;letter-spacing:1px;}#iniciar h1 span{color:var(--gold);}
  #iniciar p{color:var(--muted);font-size:2vh;}
  #iniciar button{background:linear-gradient(135deg,#d4af37,#f1c40f);color:#1a1300;border:none;border-radius:999px;padding:2vh 5vw;font-size:2.6vh;font-weight:900;box-shadow:0 0 50px rgba(212,175,55,.5);transition:transform .25s cubic-bezier(.2,1.4,.4,1),box-shadow .25s;}
  #iniciar button:hover{transform:scale(1.1);box-shadow:0 0 75px rgba(212,175,55,.75);}

  #aviso{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:400;padding:6vw;text-align:center;}
  #aviso .box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;max-width:600px;}
  #aviso h2{color:var(--gold);margin-bottom:12px;}
  #aviso p{color:var(--muted);line-height:1.6;}

  /* ---------- COMEMORAÇÕES ---------- */
  #celebra{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(3,6,20,.88);backdrop-filter:blur(4px);overflow:hidden;}
  .raios{position:absolute;width:160vh;height:160vh;background:repeating-conic-gradient(from 0deg, var(--gold) 0deg 9deg, transparent 9deg 18deg);opacity:.16;animation:girar 9s linear infinite;}
  @keyframes girar{to{transform:rotate(360deg);}}
  .heroi{position:relative;text-align:center;animation:entra .6s cubic-bezier(.2,1.4,.4,1);}
  @keyframes entra{from{transform:scale(.2);opacity:0;}to{transform:scale(1);opacity:1;}}
  .escudo{position:relative;width:52vh;height:52vh;margin:0 auto;animation:pulsa 1.4s ease-in-out infinite;filter:drop-shadow(0 0 45px rgba(212,175,55,.55));}
  @keyframes pulsa{0%,100%{transform:scale(1);}50%{transform:scale(1.04);}}
  .escudo .shield{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:2;pointer-events:none;}
  .escudo .foto{position:absolute;inset:0;z-index:1;clip-path:polygon(50% 88%,16% 57%,17% 15%,50% 17%,83% 15%,84% 57%);display:flex;align-items:center;justify-content:center;font-size:15vh;overflow:hidden;}
  .escudo .foto img{width:100%;height:100%;object-fit:cover;}
  .heroi .foto-m{width:32vh;height:32vh;border-radius:50%;margin:0 auto;overflow:hidden;border:.9vh solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:15vh;background:transparent;box-shadow:0 0 60px rgba(212,175,55,.6);animation:pulsa 1.4s ease-in-out infinite;}
  .heroi .foto-m img{width:100%;height:100%;object-fit:cover;}
  .cel-liga{margin-top:1.2vh;}
  .medal-c{width:9vh;height:9vh;object-fit:contain;font-size:4vh;filter:drop-shadow(0 4px 14px rgba(0,0,0,.5));}
  .heroi .titulo{margin-top:2.5vh;font-size:5.5vh;font-weight:900;color:var(--gold);text-shadow:0 4px 0 #00000060;letter-spacing:1px;animation:treme .5s ease-in-out 3;}
  @keyframes treme{0%,100%{transform:rotate(0);}25%{transform:rotate(-2deg);}75%{transform:rotate(2deg);}}
  .heroi .nome{font-size:6.5vh;font-weight:900;margin-top:.5vh;text-transform:uppercase;}
  .heroi .eqnome{font-size:2.8vh;font-weight:800;margin-top:.5vh;}
  .heroi .extra{font-size:2.4vh;color:var(--muted);margin-top:1vh;}
  .balao{position:absolute;bottom:-16vh;width:7vh;height:9vh;border-radius:50%;opacity:.95;animation:sobe linear forwards;z-index:1;}
  .balao::after{content:"";position:absolute;bottom:-2.4vh;left:50%;width:.3vh;height:2.6vh;background:#ffffff66;transform:translateX(-50%);}
  @keyframes sobe{to{transform:translateY(-130vh) rotate(8deg);opacity:0;}}
  .confete{position:absolute;top:-5vh;width:1.2vh;height:1.8vh;animation:cai linear forwards;z-index:1;}
  @keyframes cai{to{transform:translateY(110vh) rotate(720deg);opacity:.2;}}
  #ultra{position:fixed;inset:0;z-index:350;pointer-events:none;overflow:hidden;}
  .ultra-banner{position:absolute;top:8vh;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#d4af37,#f1c40f);color:#1a1300;padding:1.6vh 2.6vw;border-radius:999px;display:flex;align-items:center;gap:1.2vw;box-shadow:0 12px 45px #000a;animation:ultraIn .5s cubic-bezier(.2,1.4,.4,1);white-space:nowrap;}
  .ultra-banner img{width:7.5vh;height:7.5vh;border-radius:50%;object-fit:cover;border:.45vh solid #1a130055;}
  .ultra-banner .seta{font-size:4vh;}
  .ultra-banner .nm{font-size:2.9vh;font-weight:900;}
  .ultra-banner .txt{font-size:2.3vh;font-weight:800;opacity:.85;}
  .ultra-banner .ip{display:flex;align-items:center;gap:.6vw;}
  @keyframes ultraIn{from{transform:translate(-50%,-22vh);opacity:0;}to{transform:translate(-50%,0);opacity:1;}}
  .destaque{animation:piscaLinha .55s ease-in-out 7;position:relative;z-index:2;}
  @keyframes piscaLinha{0%,100%{box-shadow:0 0 0 transparent;transform:scale(1);border-color:transparent;}50%{background:rgba(212,175,55,.18);box-shadow:0 0 28px var(--gold);transform:scale(1.02);border-color:var(--gold);}}
  .conquista{margin-top:1.4vh;display:inline-block;background:linear-gradient(90deg,#d4af37,#f1c40f);color:#1a1300;font-size:2.6vh;font-weight:900;padding:1vh 2.4vw;border-radius:999px;box-shadow:0 8px 30px rgba(212,175,55,.4);animation:treme .5s ease-in-out 3;}
  #grilo{position:fixed;inset:0;z-index:340;display:flex;align-items:center;justify-content:center;background:rgba(3,6,20,.6);backdrop-filter:blur(2px);}
  #grilo .grilo-box{text-align:center;animation:entra .5s cubic-bezier(.2,1.4,.4,1);}
  #grilo .grilo-emoji{font-size:18vh;animation:pulsa 1.2s ease-in-out infinite;}
  #grilo .grilo-t{font-size:4.5vh;font-weight:900;color:var(--gold);margin-top:1vh;}
  #grilo .grilo-s{font-size:3vh;font-weight:800;color:var(--text);margin-top:.6vh;}
  #recebe{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%, rgba(6,40,18,.92), rgba(2,12,6,.94));backdrop-filter:blur(4px);overflow:hidden;}
  #recebe .moeda-bg{position:absolute;width:160vh;height:160vh;background:repeating-conic-gradient(from 0deg,var(--green) 0deg 9deg,transparent 9deg 18deg);opacity:.15;animation:girar 9s linear infinite;}
  .heroi-r{position:relative;text-align:center;}
  .heroi-r .foto-r{width:24vh;height:24vh;border-radius:50%;margin:1vh auto;overflow:hidden;border:.7vh solid var(--green);display:flex;align-items:center;justify-content:center;font-size:12vh;background:transparent;box-shadow:0 0 45px rgba(0,208,132,.6);}
  .heroi-r .foto-r img{width:100%;height:100%;object-fit:cover;}
  .titulo-r{color:#4ade80!important;}
  .forma-r{display:inline-block;margin-top:1vh;background:rgba(0,208,132,.14);border:.25vh solid rgba(0,208,132,.6);color:#86efac;font-size:2.6vh;font-weight:800;padding:.5vh 2vw;border-radius:999px;}
  .valor-r{font-size:8vh;font-weight:900;color:#4ade80;margin-top:1vh;text-shadow:0 4px 0 #00000060;letter-spacing:1px;animation:pulsa 1.1s ease-in-out infinite;}
  .moeda{position:absolute;top:-7vh;z-index:1;animation:cai linear forwards;pointer-events:none;}
</style>
</head>
<body>

<div id="aviso" class="hidden"><div class="box">
  <h2>⚙️ Configure o Firebase</h2>
  <p>Abra o arquivo <b>firebase-config.js</b> e cole as chaves do seu projeto Firebase.<br>O passo a passo está em <b>COMO-CONECTAR.txt</b>.</p>
</div></div>

<div id="iniciar">
  <div class="logo"><img src="tiers/unreal.png" alt="Unreal" onerror="this.replaceWith(document.createTextNode('🏆'))"/></div>
  <h1>RANKING <span>GRUPO VISUAL</span></h1>
  <button onclick="iniciarPainel()">ABRIR PAINEL</button>
</div>

<div id="painel" class="hidden">
  <header class="nav">
    <div class="brand"><span class="logo"><img src="tiers/unreal.png" alt="Unreal" onerror="this.replaceWith(document.createTextNode('🏆'))"/></span>
      <div><h1>GRUPO <span>VISUAL</span></h1><div class="sub">Ranking <span class="tag"><span class="pulse"></span>AO VIVO</span></div></div>
    </div>
  </header>
  <section class="podio" id="podio"></section>
  <section class="corpo">
    <div class="card">
      <div class="cardhead"><h2>📋 Colocações</h2></div>
      <div class="thead"><span class="c">#</span><span class="c">Rank</span><span>Vendedor</span><span class="r">Matr.</span><span class="r">Recebido</span><span>Progresso</span></div>
      <div class="ranking" id="ranking"></div>
    </div>
    <div class="card">
      <div class="slidehead"><h2 id="slideTitulo">📊 Gráfico de Vendas</h2><div class="slidedots" id="slideDots"></div></div>
      <div class="slidebox" id="slideBox"></div>
    </div>
  </section>
</div>

<div id="celebra" class="hidden"></div>
<div id="recebe" class="hidden"></div>
<div id="ultra" class="hidden"></div>
<div id="grilo" class="hidden"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const SHIELD_IMG="exemplo.webp";
const SOM_ULTRA="ultrapassagem.mpeg";
const SOM_GRILO="grilo.mp3";
const SOM_DINHEIRO="money.mp3";
const SOM_MATRICULA="matricula.mp3";
const FORMA_ICON={'Cartão':'💳','À vista':'💵','Boleto':'🧾','PIX':'⚡'};
// Ligas (tiers) pelo TOTAL GERAL de matriculas — do mais fraco ao mais forte
const TIERS=[
  {nome:'Bronze',min:1,cor:'#cd7f32',img:'tiers/bronze.png'},
  {nome:'Silver',min:2,cor:'#cbd5e1',img:'tiers/silver.png'},
  {nome:'Gold',min:3,cor:'#d4af37',img:'tiers/gold.png'},
  {nome:'Platinum',min:4,cor:'#5eead4',img:'tiers/platinum.png'},
  {nome:'Diamond',min:5,cor:'#60a5fa',img:'tiers/diamond.png'},
  {nome:'Elite',min:6,cor:'#a78bfa',img:'tiers/elite.png'},
  {nome:'Champion',min:7,cor:'#fb923c',img:'tiers/champion.png'},
  {nome:'Unreal',min:8,cor:'#c084fc',img:'tiers/unreal.png'}
];
function tierIdx(total){let idx=-1;for(let i=0;i<TIERS.length;i++){if(total>=TIERS[i].min)idx=i;}return idx;}
function medalFallback(img,nome,cor){const s=document.createElement('span');s.className=img.className+' medal-fb';s.textContent=(nome||'?').charAt(0);s.style.background=cor;s.title=nome||'';img.replaceWith(s);}
function medalHTML(total,cls){const i=tierIdx(total);if(i<0)return `<span class="${cls} medal-traco" title="Sem rank">-</span>`;const t=TIERS[i];return `<img class="${cls}" src="${t.img}" title="${t.nome}" onerror="medalFallback(this,'${t.nome}','${t.cor}')"/>`;}
let equipes=[],vendedores=[],matriculas=[],recebimentos=[],periodo='hoje',som=true;
let lastRecebeTs=0,primeiroRecebe=true,recebeTimer=null;
let db=null,lastCelebTs=0,primeiraCeleb=true;
let lastTesteTs=0,primeiraTeste=true;
let prevOrder=null,somUltra=null,somGrilo=null,somDinheiro=null,somMatricula=null,config={tempoCeleb:8,valorMatricula:0,inatividadeMin:0,volComemoracao:100,periodo:'hoje'};
let ultimaAtividade=Date.now(),griloMostrado=false,painelAtivo=false;
let lastGriloTs=0,primeiroGrilo=true;

// ---- Firebase ----
function cfgValida(){const c=window.FIREBASE_CONFIG||{};return c.apiKey&&c.apiKey.indexOf('COLE_AQUI')<0&&c.databaseURL&&c.databaseURL.indexOf('SEU-PROJETO')<0;}
function conectar(){
  if(!cfgValida()){document.getElementById('aviso').classList.remove('hidden');return;}
  firebase.initializeApp(window.FIREBASE_CONFIG);
  db=firebase.database();
  // Listeners por filho: uma nova matrícula NÃO faz a TV rebaixar as fotos dos vendedores, equipes etc.
  db.ref('painel/estado/equipes').on('value',s=>{equipes=s.val()||[];renderPainel();});
  db.ref('painel/estado/vendedores').on('value',s=>{vendedores=s.val()||[];renderPainel();});
  db.ref('painel/estado/matriculas').on('value',s=>{matriculas=s.val()||[];renderPainel();checarUltra();});
  db.ref('painel/estado/recebimentos').on('value',s=>{recebimentos=s.val()||[];renderPainel();});
  db.ref('painel/estado/config').on('value',s=>{
    const c=s.val();if(c)config={...config,...c};
    const np=config.periodo||'hoje';const pmudou=np!==periodo;periodo=np;
    aplicarVolumes();renderPainel();
    if(pmudou)rebaseOrder();
  });
  db.ref('painel/celebra').on('value',snap=>{
    const c=snap.val(); if(!c||!c.ts) return;
    if(primeiraCeleb){primeiraCeleb=false;lastCelebTs=c.ts;return;} // nao comemora ao abrir
    if(c.ts!==lastCelebTs){lastCelebTs=c.ts; celebrar(c.vendedorId);}
  });
  db.ref('painel/testeultra').on('value',snap=>{
    const t=snap.val(); if(!t||!t.ts) return;
    if(primeiraTeste){primeiraTeste=false;lastTesteTs=t.ts;return;}
    if(t.ts!==lastTesteTs){lastTesteTs=t.ts; mostrarUltrapassagem(t.xId,t.yId);}
  });
  db.ref('painel/grilo').on('value',snap=>{
    const g=snap.val(); if(!g||!g.ts) return;
    if(primeiroGrilo){primeiroGrilo=false;lastGriloTs=g.ts;return;}
    if(g.ts!==lastGriloTs){lastGriloTs=g.ts; mostrarGrilo();}
  });
  db.ref('painel/recebe').on('value',snap=>{
    const c=snap.val(); if(!c||!c.ts) return;
    if(primeiroRecebe){primeiroRecebe=false;lastRecebeTs=c.ts;return;} // nao comemora ao abrir
    if(c.ts!==lastRecebeTs){lastRecebeTs=c.ts; celebrarRecebimento(c.vendedorId,c.valor,c.forma);}
  });
}
// ---- util ----
const fmtBRL=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function hojeStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function mesStr(){return hojeStr().slice(0,7);}
function noPeriodo(m){if(periodo==='tudo')return true;if(periodo==='hoje')return (m.data||'')===hojeStr();if(periodo==='mes')return (m.data||'').slice(0,7)===mesStr();return true;}
const getVend=id=>vendedores.find(v=>v.id===id);
const getEq=id=>equipes.find(e=>e.id===id);
const fotoEl=v=>v&&v.foto?`<img class="foto" src="${v.foto}"/>`:`<div class="foto">🧑‍💼</div>`;

function stats(){
  const mats=matriculas.filter(noPeriodo);const recs=recebimentos.filter(noPeriodo);const porVend={},porEq={};
  vendedores.forEach(v=>porVend[v.id]={v,qtd:0,valor:0,rec:0,recQtd:0});
  equipes.forEach(e=>porEq[e.id]={e,qtd:0,valor:0,rec:0,recQtd:0});
  mats.forEach(m=>{if(porVend[m.vendedorId]){porVend[m.vendedorId].qtd++;porVend[m.vendedorId].valor+=Number(m.valor)||0;}const v=getVend(m.vendedorId);if(v&&porEq[v.equipeId]){porEq[v.equipeId].qtd++;porEq[v.equipeId].valor+=Number(m.valor)||0;}});
  recs.forEach(r=>{if(porVend[r.vendedorId]){porVend[r.vendedorId].rec+=Number(r.valor)||0;porVend[r.vendedorId].recQtd++;}const v=getVend(r.vendedorId);if(v&&porEq[v.equipeId]){porEq[v.equipeId].rec+=Number(r.valor)||0;porEq[v.equipeId].recQtd++;}});
  return {porVend,porEq};
}
// TABELA DE RANKING (estilo ações)
function iniciais(n){return (n||'').trim().split(/\s+/).map(p=>p[0]||'').slice(0,2).join('').toUpperCase()||'🧑';}
// cor da barra pela qtd de matriculas: amarelo (1-2) -> azul (3-4) -> verde (5+)
function corBarra(q){return q<=2?'#f1c40f':q<=4?'#3b82f6':'#00d084';}
function renderRanking(){
  const {porVend}=stats();let arr=Object.values(porVend).sort((a,b)=>b.qtd-a.qtd||b.valor-a.valor);const max=Math.max(1,...arr.map(a=>a.qtd));
  const el=document.getElementById('ranking');
  const resto=arr; // todos os vendedores, do 1o lugar em diante
  if(!resto.length){el.innerHTML='<div class="vazio">Nenhuma colocação no período ainda.</div>';return;}
  el.innerHTML=resto.map((a,i)=>{const eq=getEq(a.v.equipeId)||{nome:'',cor:'#888'};
    const ic=a.v.foto?`<span class="t-ic"><img src="${a.v.foto}"/></span>`:`<span class="t-ic" style="background:${eq.cor}">${iniciais(a.v.nome)}</span>`;
    return `<div class="trow${a.qtd>0&&i<3?' pod'+(i+1):''}" data-vid="${a.v.id}">
      <span class="t-rank">${a.qtd>0?(i+1):'-'}</span>
      <span class="t-medal">${medalHTML(a.qtd,'medal-r')}</span>
      <span class="t-vend">${ic}<span class="t-nm">${a.v.nome}<small style="color:${eq.cor}">${eq.nome}</small></span></span>
      <span class="t-qtd">${a.qtd}</span>
      <span class="t-rec${a.rec>0?' recebeu':''}">${fmtBRL(a.rec)}</span>
      <span class="t-bar"><i style="width:${Math.min(a.qtd,5)/5*100}%;background:${corBarra(a.qtd)}"></i></span>
    </div>`;}).join('');
}
const medalha=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'º';
function fotoMini(v){return v&&v.foto?`<img class="foto" src="${v.foto}"/>`:`<div class="foto">🧑‍💼</div>`;}
function colBar(foto,nome,altPct,cor,label){return `<div class="gcol"><div class="gbar" style="height:${altPct}%;background:linear-gradient(${cor},${cor}99)"><span class="gv">${label}</span></div>${foto?`<img class="gfoto" src="${foto}"/>`:`<div class="gfoto">🧑‍💼</div>`}<div class="gnm">${(nome||'').split(' ')[0]}</div></div>`;}
// --- slides do painel rotativo ---
function slideGraficoVendas(){
  const {porVend}=stats();let arr=Object.values(porVend).filter(a=>a.qtd>0).sort((a,b)=>b.qtd-a.qtd).slice(0,6);const max=Math.max(1,...arr.map(a=>a.qtd));
  if(!arr.length)return '<div class="vazio">Sem matrículas no período.</div>';
  return '<div class="grafico">'+arr.map(a=>colBar(a.v.foto,a.v.nome,Math.min(a.qtd,5)/5*100,corBarra(a.qtd),a.qtd)).join('')+'</div>';
}
function slideGraficoReceb(){
  const {porVend}=stats();let arr=Object.values(porVend).filter(a=>a.rec>0).sort((a,b)=>b.rec-a.rec).slice(0,6);const max=Math.max(1,...arr.map(a=>a.rec));
  if(!arr.length)return '<div class="vazio">Sem recebimentos no período.</div>';
  return '<div class="grafico">'+arr.map(a=>colBar(a.v.foto,a.v.nome,a.rec/max*100,'#00d084','<span style="font-size:1.4vh">'+fmtBRL(a.rec)+'</span>')).join('')+'</div>';
}
function slideRankVendas(){
  const {porVend}=stats();let arr=Object.values(porVend).filter(a=>a.qtd>0).sort((a,b)=>b.qtd-a.qtd||b.valor-a.valor).slice(0,6);const max=Math.max(1,...arr.map(a=>a.qtd));
  if(!arr.length)return '<div class="vazio">Sem vendas no período.</div>';
  return '<div class="ranking">'+arr.map((a,i)=>{const eq=getEq(a.v.equipeId)||{nome:'',cor:'#888'};return `<div class="linha"><div class="pos">${medalha(i)}</div>${fotoMini(a.v)}<div class="info"><div class="nm">${a.v.nome}</div><div class="eqtag" style="color:${eq.cor}">${eq.nome}</div></div><div class="barra"><i style="width:${Math.min(a.qtd,5)/5*100}%;background:${corBarra(a.qtd)}"></i></div><div class="qtd">${a.qtd}</div></div>`;}).join('')+'</div>';
}
function slideRankReceb(){
  const {porVend}=stats();let arr=Object.values(porVend).filter(a=>a.rec>0).sort((a,b)=>b.rec-a.rec).slice(0,6);const max=Math.max(1,...arr.map(a=>a.rec));
  if(!arr.length)return '<div class="vazio">Sem recebimentos no período.</div>';
  return '<div class="ranking">'+arr.map((a,i)=>{const eq=getEq(a.v.equipeId)||{nome:'',cor:'#888'};return `<div class="linha"><div class="pos">${medalha(i)}</div>${fotoMini(a.v)}<div class="info"><div class="nm">${a.v.nome}</div><div class="eqtag" style="color:${eq.cor}">${eq.nome}</div></div><div class="barra"><i style="width:${a.rec/max*100}%;background:#00d084"></i></div><div class="qtd" style="font-size:2vh;width:auto">${fmtBRL(a.rec)}</div></div>`;}).join('')+'</div>';
}
function slideEquipes(){
  const {porEq}=stats();const arr=equipes.map(e=>porEq[e.id]||{e,qtd:0,valor:0,rec:0});if(!arr.length)return '<div class="vazio">Cadastre as equipes.</div>';
  const maxQ=Math.max(1,...arr.map(a=>a.qtd));const ord=[...arr].sort((a,b)=>b.qtd-a.qtd||b.rec-a.rec);
  return '<div class="ranking">'+ord.map((a,i)=>`<div class="linha" style="flex-direction:column;align-items:stretch;gap:.7vh">
    <div style="display:flex;align-items:center;gap:1vw">
      <div class="pos" style="width:auto">${i===0?'👑':(i+1)+'º'}</div>
      <div class="nm" style="color:${a.e.cor};flex:1;font-size:2.3vh">🛡️ ${a.e.nome}</div>
      <div style="text-align:right;font-size:1.7vh;font-weight:700"><span style="color:var(--gold)">${a.qtd}</span> matr. · <span style="color:var(--green)">${fmtBRL(a.rec)}</span></div>
    </div>
    <div class="barra" style="flex:none;height:1.4vh"><i style="width:${a.qtd/maxQ*100}%;background:${a.e.cor}"></i></div></div>`).join('')+'</div>';
}
// Acumulado: vendas de dias anteriores (manual) + hoje (matriculas). So exibicao — NAO entra no ranking/meta do dia
function slideDiasAnteriores(){
  const hoje=hojeStr();
  let arr=vendedores.map(v=>{const ant=Number(v.vendasAnteriores)||0;const hj=matriculas.filter(m=>m.vendedorId===v.id&&m.data===hoje).length;return {v,ant,hj,total:ant+hj};}).filter(a=>a.total>0).sort((a,b)=>b.total-a.total).slice(0,6);
  if(!arr.length)return '<div class="vazio">Sem vendas de dias anteriores cadastradas no painel.</div>';
  const max=Math.max(1,...arr.map(a=>a.total));
  return '<div class="ranking">'+arr.map((a,i)=>{const eq=getEq(a.v.equipeId)||{nome:'',cor:'#888'};return `<div class="linha"><div class="pos">${medalha(i)}</div>${fotoMini(a.v)}<div class="info"><div class="nm">${a.v.nome}</div><div class="eqtag" style="color:${eq.cor}">${eq.nome} · ${a.ant} ant + ${a.hj} hoje</div></div><div class="barra"><i style="width:${a.total/max*100}%;background:${eq.cor}"></i></div><div class="qtd">${a.total}</div></div>`;}).join('')+'</div>';
}
function slideLigas(){
  const {porVend}=stats();
  const cont=TIERS.map(()=>0);
  vendedores.forEach(v=>{const q=porVend[v.id]?porVend[v.id].qtd:0;const i=tierIdx(q);if(i>=0)cont[i]++;});
  const ordem=TIERS.map((t,i)=>({t,n:cont[i]})).reverse(); // mais forte primeiro, Bronze por ultimo
  return '<div class="ladder">'+ordem.map(({t,n})=>`<div class="lad"><div class="lad-medal"><img class="medal-l" src="${t.img}" onerror="medalFallback(this,'${t.nome}','${t.cor}')"/></div><div class="lad-nm" style="color:${t.cor}">${t.nome}</div><div class="lad-ct">${n}</div></div>`).join('')+'</div>';
}
const SLIDES=[
  {t:'📊 Gráfico de Vendas',f:slideGraficoVendas},
  {t:'🥇 Ranking de Vendas',f:slideRankVendas},
  {t:'💰 Gráfico de Recebimentos',f:slideGraficoReceb},
  {t:'🏆 Ranking de Recebimentos',f:slideRankReceb},
  {t:'🛡️ Equipes — quem está na frente',f:slideEquipes},
  {t:'📅 Acumulado — dias anteriores + hoje',f:slideDiasAnteriores}
];
let slideIdx=0;
function renderSlide(){
  const box=document.getElementById('slideBox');if(!box)return;
  const s=SLIDES[slideIdx%SLIDES.length];
  const tit=document.getElementById('slideTitulo');if(tit)tit.textContent=s.t;
  box.innerHTML=s.f();
  box.classList.remove('fadein');void box.offsetWidth;box.classList.add('fadein');
  const dots=document.getElementById('slideDots');if(dots)dots.innerHTML=SLIDES.map((x,i)=>`<i class="${i===slideIdx%SLIDES.length?'on':''}"></i>`).join('');
}
function proximoSlide(){slideIdx=(slideIdx+1)%SLIDES.length;renderSlide();}
function renderPodio(){
  const {porVend}=stats();
  const arr=Object.values(porVend).filter(a=>a.qtd>0).sort((a,b)=>b.qtd-a.qtd||b.valor-a.valor);
  const cont=document.getElementById('podio');if(!cont)return;
  if(!arr.length){cont.innerHTML='<div class="vazio" style="width:100%">Aguardando matrículas no período...</div>';return;}
  const med={1:'🥇',2:'🥈',3:'🥉'},cor={1:'#d4af37',2:'#cbd5e1',3:'#cd7f32'};
  const ordem=[{a:arr[1],pos:2},{a:arr[0],pos:1},{a:arr[2],pos:3}]; // 2º à esquerda, 1º no centro, 3º à direita
  cont.innerHTML=ordem.map(({a,pos})=>{
    if(!a)return '<div class="pod pod-'+pos+' pod-vazio"><div class="pedestal"></div></div>';
    const eq=getEq(a.v.equipeId)||{nome:'',cor:'#888'};
    const foto=a.v.foto?`<img src="${a.v.foto}"/>`:'🧑';
    return `<div class="pod pod-${pos}" style="--pc:${cor[pos]}">
      <div class="pod-rank">${pos}º</div>
      <div class="pod-med">${medalHTML(a.qtd,'medal-pod')||med[pos]}</div>
      <div class="pod-av">${foto}</div>
      <div class="pod-nm">${a.v.nome}</div>
      <div class="pod-eq" style="color:${eq.cor}">${eq.nome}</div>
      <div class="pedestal">
        <div class="pod-pts">${a.qtd}<span>matrículas</span></div>
        ${a.rec>0?`<div class="pod-prize">${fmtBRL(a.rec)}</div>`:''}
      </div>
    </div>`;
  }).join('');
}
function renderPainel(){renderPodio();renderRanking();renderSlide();}

// ---- ultrapassagem no ranking ----
let ultraTimer=null;
function currentOrder(){const {porVend}=stats();return Object.values(porVend).filter(a=>a.qtd>0).sort((a,b)=>b.qtd-a.qtd||b.valor-a.valor).map(a=>a.v.id);}
function checarUltra(){
  const ord=currentOrder();
  if(prevOrder){
    for(let i=0;i<ord.length;i++){
      const x=ord[i],ant=prevOrder.indexOf(x);
      if(ant>i){ // x subiu de posição
        let passado=null;
        for(let j=i+1;j<ord.length;j++){const y=ord[j],antY=prevOrder.indexOf(y);if(antY>-1&&antY<ant){passado=y;break;}}
        if(passado!=null){const X=x,Y=passado;setTimeout(()=>mostrarUltrapassagem(X,Y),1200);break;}
      }
    }
  }
  prevOrder=ord;
}
function rebaseOrder(){prevOrder=currentOrder();}
function tocarUltrapassagem(){if(!som)return;try{if(!somUltra)somUltra=new Audio(SOM_ULTRA);somUltra.volume=volCom();somUltra.currentTime=0;somUltra.play().catch(()=>{});}catch(e){}}
function confeteEm(cont,n){const cores=['#d4af37','#00d084','#3b82f6','#ff4757','#a855f7','#ec4899','#fff'];for(let i=0;i<(n||70);i++){const c=document.createElement('div');c.className='confete';c.style.left=(Math.random()*100)+'vw';c.style.background=cores[Math.floor(Math.random()*cores.length)];c.style.animationDuration=(2.5+Math.random()*2.5)+'s';c.style.animationDelay=(Math.random()*1)+'s';if(Math.random()>.5)c.style.borderRadius='50%';cont.appendChild(c);setTimeout(()=>c.remove(),6000);}}
function mostrarUltrapassagem(xId,yId){
  const x=getVend(xId),y=getVend(yId);if(!x||!y)return;
  const u=document.getElementById('ultra');u.classList.remove('hidden');
  const ava=v=>v.foto?`<img src="${v.foto}"/>`:`<span style="font-size:4vh">🧑‍💼</span>`;
  u.innerHTML=`<div class="ultra-banner"><span class="seta">🏎️💨</span><div class="ip">${ava(x)}<span class="nm">${x.nome}</span></div><span class="txt">ultrapassou</span><div class="ip" style="opacity:.7">${ava(y)}<span class="nm">${y.nome}</span></div></div>`;
  confeteEm(u,90);tocarUltrapassagem();
  const ln=document.querySelector('.trow[data-vid="'+xId+'"]');if(ln){ln.classList.add('destaque');setTimeout(()=>ln.classList.remove('destaque'),3800);}
  clearTimeout(ultraTimer);ultraTimer=setTimeout(()=>{u.classList.add('hidden');u.innerHTML='';},5500);
}

// ---- celebracao ----
let celebTimer=null;
function celebrar(vendedorId){
  ultimaAtividade=Date.now();griloMostrado=false;esconderGrilo();
  const v=getVend(vendedorId);if(!v)return;const eq=getEq(v.equipeId)||{nome:'',cor:'#d4af37'};
  const qtdHoje=matriculas.filter(m=>m.vendedorId===vendedorId&&m.data===hojeStr()).length;
  const marco=(qtdHoje>=5&&qtdHoje%5===0);
  const cel=document.getElementById('celebra');cel.classList.remove('hidden');
  cel.innerHTML=`<div class="raios"></div><div class="heroi">
    <div class="foto-m">${v.foto?`<img src="${v.foto}"/>`:'🦸'}</div>
    <div class="titulo">⚡ NOVA MATRÍCULA! ⚡</div><div class="nome">${v.nome}</div>
    <div class="eqnome" style="color:${eq.cor}">🛡️ ${eq.nome}</div></div>`;
  soltarBaloes(eq.cor);soltarConfete();if(marco)soltarConfete();tocarMatricula();
  clearTimeout(celebTimer);celebTimer=setTimeout(()=>cel.classList.add('hidden'),(config.tempoCeleb||8)*1000);
  cel.onclick=()=>cel.classList.add('hidden');
}
function soltarBaloes(cor){const cores=[cor,'#d4af37','#00d084','#3b82f6','#ff4757','#a855f7','#ec4899'];const cel=document.getElementById('celebra');for(let i=0;i<26;i++){const b=document.createElement('div');b.className='balao';b.style.left=(Math.random()*100)+'vw';b.style.background=cores[Math.floor(Math.random()*cores.length)];b.style.animationDuration=(3+Math.random()*3)+'s';b.style.animationDelay=(Math.random()*1.5)+'s';b.style.transform='scale('+(.7+Math.random()*.8)+')';cel.appendChild(b);setTimeout(()=>b.remove(),7000);}}
function soltarConfete(){const cores=['#d4af37','#00d084','#3b82f6','#ff4757','#a855f7','#ec4899','#fff'];const cel=document.getElementById('celebra');for(let i=0;i<70;i++){const c=document.createElement('div');c.className='confete';c.style.left=(Math.random()*100)+'vw';c.style.background=cores[Math.floor(Math.random()*cores.length)];c.style.animationDuration=(2.5+Math.random()*2.5)+'s';c.style.animationDelay=(Math.random()*1.2)+'s';if(Math.random()>.5)c.style.borderRadius='50%';cel.appendChild(c);setTimeout(()=>c.remove(),6000);}}
let audioCtx=null;
function tocarFanfarra(){if(!som)return;if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}}if(audioCtx.state==='suspended')audioCtx.resume();const notas=[523.25,659.25,783.99,1046.5,1046.5],dur=[.16,.16,.16,.18,.5];let t=audioCtx.currentTime+.02;notas.forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0001,.35*volCom()),t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur[i]);o.start(t);o.stop(t+dur[i]+.02);t+=dur[i]*.9;});}
function tocarMatricula(){
  if(!som)return;
  try{
    if(!somMatricula)somMatricula=new Audio(SOM_MATRICULA);
    somMatricula.volume=volCom();
    somMatricula.currentTime=0;
    const p=somMatricula.play();
    if(p&&p.catch)p.catch(()=>tocarFanfarra()); // se faltar o arquivo matricula.mp3, usa a fanfarra sintetizada
  }catch(e){tocarFanfarra();}
}

// ---- comemoracao de RECEBIMENTO (formato proprio: dinheiro) ----
function celebrarRecebimento(vendedorId,valor,forma){
  ultimaAtividade=Date.now();griloMostrado=false;esconderGrilo();
  const v=getVend(vendedorId);if(!v)return;const eq=getEq(v.equipeId)||{nome:'',cor:'#00d084'};
  const fic=FORMA_ICON[forma]||'💳';
  const cel=document.getElementById('recebe');cel.classList.remove('hidden');
  cel.innerHTML=`<div class="moeda-bg"></div><div class="heroi heroi-r">
    <div class="foto-r">${v.foto?`<img src="${v.foto}"/>`:'🤑'}</div>
    <div class="titulo titulo-r">💸 RECEBIMENTO! 💸</div>
    <div class="nome">${v.nome}</div>
    <div class="eqnome" style="color:${eq.cor}">🛡️ ${eq.nome}</div>
    ${forma?`<div class="forma-r">${fic} ${forma}</div>`:''}
    <div class="valor-r">${fmtBRL(valor)}</div></div>`;
  choverDinheiro();confeteEm(cel,90);tocarDinheiro();
  clearTimeout(recebeTimer);recebeTimer=setTimeout(esconderRecebe,(config.tempoCeleb||8)*1000);
  cel.onclick=esconderRecebe;
}
function esconderRecebe(){const c=document.getElementById('recebe');c.classList.add('hidden');c.innerHTML='';pararDinheiro();}
function choverDinheiro(){const ic=['💵','💰','🪙','💸','🤑','💲'];const cel=document.getElementById('recebe');for(let i=0;i<46;i++){const d=document.createElement('div');d.className='moeda';d.textContent=ic[Math.floor(Math.random()*ic.length)];d.style.left=(Math.random()*100)+'vw';d.style.fontSize=(2.2+Math.random()*3.2)+'vh';d.style.animationDuration=(2.4+Math.random()*2.6)+'s';d.style.animationDelay=(Math.random()*1.2)+'s';cel.appendChild(d);setTimeout(()=>d.remove(),6000);}}
function tocarCaixa(){if(!som)return;if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}}if(audioCtx.state==='suspended')audioCtx.resume();const notas=[1318.5,1567.98,2093.0],dur=[.10,.10,.5];let t=audioCtx.currentTime+.02;notas.forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0001,.28*volCom()),t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur[i]);o.start(t);o.stop(t+dur[i]+.02);t+=dur[i]*.75;});}
function tocarDinheiro(){
  if(!som)return;
  try{
    if(!somDinheiro)somDinheiro=new Audio(SOM_DINHEIRO);
    somDinheiro.volume=volCom();
    somDinheiro.currentTime=0;
    const p=somDinheiro.play();
    if(p&&p.catch)p.catch(()=>tocarCaixa()); // se faltar o arquivo, usa o som sintetizado
  }catch(e){tocarCaixa();}
}
function pararDinheiro(){try{if(somDinheiro){somDinheiro.pause();somDinheiro.currentTime=0;}}catch(e){}}

// ---- volumes dos sons de comemoracao ----
function volCom(){return Math.max(0,Math.min(1,(config.volComemoracao==null?100:config.volComemoracao)/100));}
function aplicarVolumes(){
  const vc=volCom();
  if(somUltra)somUltra.volume=vc;
  if(somGrilo)somGrilo.volume=vc;
  if(somDinheiro)somDinheiro.volume=vc;
  if(somMatricula)somMatricula.volume=vc;
}

// ---- inatividade (grilo) ----
let griloTimer=null;
function tocarSomGrilo(){if(!som)return;try{if(!somGrilo)somGrilo=new Audio(SOM_GRILO);somGrilo.volume=volCom();somGrilo.currentTime=0;somGrilo.play().catch(()=>{});}catch(e){}}
function mostrarGrilo(){
  const g=document.getElementById('grilo');g.classList.remove('hidden');
  g.innerHTML=`<div class="grilo-box"><div class="grilo-emoji">🦗</div><div class="grilo-t">Tá muito quieto por aqui...</div><div class="grilo-s">Bora vender! 🚀</div></div>`;
  tocarSomGrilo();
  clearTimeout(griloTimer);griloTimer=setTimeout(esconderGrilo,7000);
}
function esconderGrilo(){const g=document.getElementById('grilo');if(g){g.classList.add('hidden');g.innerHTML='';}}
function checarInatividade(){
  if(!painelAtivo||griloMostrado)return;
  const min=Number(config.inatividadeMin)||0;if(min<=0)return;
  if(Date.now()-ultimaAtividade>=min*60000){griloMostrado=true;mostrarGrilo();}
}
setInterval(checarInatividade,20000);

function iniciarPainel(){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}catch(e){}document.getElementById('iniciar').classList.add('hidden');document.getElementById('painel').classList.remove('hidden');painelAtivo=true;ultimaAtividade=Date.now();try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}catch(e){}renderPainel();}
setInterval(proximoSlide,7000);

// ---- rolagem lenta da tabela de Colocacoes (a cada 30s revela os demais) ----
let rankAnim=null;
function animarScrollRank(el,destino,dur,cb){
  if(rankAnim)clearInterval(rankAnim);
  const ini=el.scrollTop,dist=destino-ini;
  if(Math.abs(dist)<1){el.scrollTop=destino;if(cb)cb();return;}
  const t0=Date.now();
  rankAnim=setInterval(()=>{
    const p=Math.min(1,(Date.now()-t0)/dur);
    const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2; // easeInOut
    el.scrollTop=ini+dist*e;
    if(p>=1){clearInterval(rankAnim);rankAnim=null;if(cb)cb();}
  },16);
}
function rolarColocacoes(){
  if(!painelAtivo)return;
  const el=document.getElementById('ranking');if(!el)return;
  const max=el.scrollHeight-el.clientHeight;
  if(max<=6){el.scrollTop=0;return;} // tudo cabe, nada a rolar
  animarScrollRank(el,max,Math.max(5000,max*22),()=>{          // desce devagar
    setTimeout(()=>animarScrollRank(el,0,3500),2500);          // pausa e volta
  });
}
setInterval(rolarColocacoes,30000);

conectar();renderPainel();
</script>
